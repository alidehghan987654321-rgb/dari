# Streams the hunter's SQLite database to Cloudflare R2 (Cloudflare Containers only; see
# cloudflare-start.sh). Litestream fills in the ${...} settings from the environment.
dbs:
  - path: ${HUNTER_DB}
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: hunter
        endpoint: ${LITESTREAM_ENDPOINT}
        region: auto
        force-path-style: true
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        # A fresh snapshot every day, and 30 days of history to go back to.
        snapshot-interval: 24h
        retention: 720h
