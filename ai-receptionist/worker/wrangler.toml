name = "ai-receptionist"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Owner panel (M3): static files from ../web, served on the same origin as /api so the session cookie
# stays first-party. /panel/ -> web/panel/index.html. Anything that is not a file goes to the Worker.
[assets]
directory = "../web"

[[d1_databases]]
binding = "DB"
database_name = "receptionist"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"

[vars]
RETENTION_DAYS = "90"
# TEAM_ALERT_CHAT_ID = "-100..."   # our team Telegram chat for monitoring alerts (M2); the bot must be a member
# EXTERNAL_BOOKING_API = "https://booking.example.com/api"   # our own booking product, when connected

[triggers]
# */5 * * * *  alert rules (M2)
# 17 3 * * *   daily 03:17 UTC: data retention + synthetic check of every active business (M2)
crons = ["*/5 * * * *", "17 3 * * *"]

# Workers Logs: keeps the one-line JSON tool logs searchable in the dashboard.
[observability]
enabled = true

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   TOOL_SECRET                 shared with ElevenLabs tool headers
#   ADMIN_SECRET                for /admin routes
#   ELEVENLABS_WEBHOOK_SECRET   post-call webhook HMAC
#   TELEGRAM_BOT_TOKEN          owner notifications
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM   confirmation SMS
#   EXTERNAL_BOOKING_KEY        optional
#   SESSION_SECRET              owner panel: HMAC key for login codes and sessions (M3)
#   RESEND_API_KEY, EMAIL_FROM  owner panel: login codes by email (optional; SMS works without it) (M3)
#   ELEVENLABS_API_KEY          owner panel: play call recordings (optional) (M3)
